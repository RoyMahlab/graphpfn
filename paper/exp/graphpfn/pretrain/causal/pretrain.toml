[base_config.causal_prior]
# Discard datasets with fewer feature columns (matches the default prior's sanity_check).
min_features = 4
# Class count is drawn uniform_int(2, max_num_classes) per batch (matches task.n_classes max).
max_num_classes = 10

# Graph size: log-uniform-int, drawn once per batch (matches the default prior's graph.n_nodes).
[base_config.causal_prior.n_nodes]
min = 1000
max = 2500

# Train fraction: uniform, drawn once per batch (matches the default prior's train_ratio).
[base_config.causal_prior.train_ratio]
min = 0.05
max = 0.5

# Target mean degree: mixed-log-uniform, drawn once per batch (matches the default prior's
# graph.avg_degree). The similarity threshold is chosen per graph to hit this degree, which
# keeps density in the well-behaved regime (raw thresholding can yield near-complete graphs
# that overflow DGL's negative sampler).
[base_config.causal_prior.avg_degree]
min_first = 1.5
max_first = 100.0
min_second = 100.0
max_second = 500.0
p_first = 0.5

# All remaining graph-generation hyperparameters (SCM depth/width, num causes, dropout,
# feature count, similarity kernel, ...) are sampled by casual_graph_generation.sample_config,
# which mirrors the causal prior. Pin any GraphConfig field under [base_config.causal_prior.fixed]
# to override the draw, e.g.:
# [base_config.causal_prior.fixed]
# similarity = "cosine"

[base_config.sampler]
batch_size = 1
n_workers = 12
prefetch_factor = 24
verbose = true

[base_config.model.edge_head]

[base_config.ema]
decay = 0.98

[base_config.lr_scheduler]
n_warmup_steps = 1000
scheduler = "cosine"

[base_config.ssl.edge]
coef = 0.1
